[pytest]
DJANGO_SETTINGS_MODULE = core.settings.test
python_files = tests.py test_*.py *_tests.py
addopts = -q
markers =
    order: 声明测试的执行顺序（供 apps/agent/tests/test_trading_flow.py 等使用）
    slow: 标记耗时较长的测试（仅作分类，不改变默认行为）
    integration: 需要外部依赖（Redis/PostgreSQL/交易所）的集成测试
    e2e: 端到端测试，可能触发真实 LLM / 网络调用
